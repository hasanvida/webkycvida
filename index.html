<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Enterprise eKYC Demo Portal</title>
<script src="https://web-sdk.vida.id/1.1.0/sandbox/vida-web-sdk.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--primary:#00c37b;
--secondary:#011627;
--bg-body:#f4f7f9;
--card-bg:#ffffff;
--text-main:#1e293b;
--text-muted:#64748b;
--border:#e2e8f0;
}

body{
margin:0;
font-family:'Inter',system-ui,sans-serif;
background:var(--bg-body);
color:var(--text-main);
display:flex;
flex-direction:column;
min-height:100vh;
}

header{
background:white;
padding:1rem 2rem;
border-bottom:1px solid var(--border);
font-weight:600;
}

.container{
max-width:1100px;
margin:2rem auto;
padding:0 1rem;
display:grid;
grid-template-columns:320px 1fr;
gap:2rem;
flex-grow:1;
}

.card{
background:var(--card-bg);
border:1px solid var(--border);
border-radius:16px;
padding:1.75rem;
box-shadow:0 4px 6px rgba(0,0,0,0.05);
}

h3{
font-size:0.7rem;
text-transform:uppercase;
letter-spacing:.1em;
color:var(--text-muted);
margin-bottom:1.25rem;
font-weight:700;
}

.country-toggle{
display:grid;
grid-template-columns:1fr 1fr;
gap:4px;
background:#f1f5f9;
padding:4px;
border-radius:10px;
margin-bottom:2rem;
}

.btn-toggle{
background:transparent;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
font-weight:600;
color:var(--text-muted);
}

.btn-toggle.active{
background:white;
color:var(--secondary);
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.button-stack{
display:flex;
flex-direction:column;
gap:.8rem;
}

button.btn-action{
text-align:left;
background:white;
border:1px solid var(--border);
padding:16px;
border-radius:10px;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:600;
color:var(--secondary);
}

button.btn-action:hover{
border-color:var(--primary);
background:#f0fff9;
}

#sdk-container{
height:520px;
display:none;
border:1px solid var(--border);
border-radius:12px;
margin-bottom:1rem;
background:#000;
}

pre{
background:var(--secondary);
color:#94a3b8;
padding:1.5rem;
border-radius:12px;
font-size:13px;
overflow-x:auto;
min-height:150px;
margin:0;
}

.back-btn{
display:none;
margin-bottom:12px;
padding:10px 16px;
background:var(--primary);
border:none;
border-radius:8px;
font-weight:600;
cursor:pointer;
}

footer{
padding:2rem;
text-align:center;
border-top:1px solid var(--border);
background:white;
font-size:13px;
color:#64748b;
}

</style>
</head>

<body>

<header>
Enterprise eKYC Demo Portal
</header>

<div class="container">

<aside>
<div class="card">

<h3>Regional Context</h3>

<div class="country-toggle">
<button id="btn-id" class="btn-toggle active" onclick="setCountry('ID')">Indonesia</button>
<button id="btn-my" class="btn-toggle" onclick="setCountry('MY')">Malaysia</button>
</div>

<h3>Workflows</h3>

<div class="button-stack">
<button class="btn-action" onclick="startDocumentOnly()">Document Capture</button>
<button class="btn-action" onclick="startFullVerification()">Full Verification</button>
<button class="btn-action" onclick="startLivenessOnly()">Liveness Check</button>
</div>

</div>
</aside>

<main>

<div class="card">

<h3>Developer Console</h3>

<button id="backBtn" class="back-btn" onclick="goHome()">⬅ Back</button>

<div id="sdk-container"></div>

<pre id="result">// Ready. Select a workflow to begin.</pre>

</div>

</main>

</div>

<footer>
Enterprise Demo Portal
</footer>

<script>

let selectedCountry="ID"

const result=document.getElementById("result")
const sdkContainer=document.getElementById("sdk-container")
const backBtn=document.getElementById("backBtn")

function setCountry(country){

selectedCountry=country

document.getElementById("btn-id").classList.toggle("active",country==="ID")
document.getElementById("btn-my").classList.toggle("active",country==="MY")

result.textContent=`// Switched to ${country}`

}

async function fetchToken(){

const res=await fetch("/.netlify/functions/get-token")

if(!res.ok) throw new Error("Token fetch failed")

return await res.json()

}

function resetSDK(){

sdkContainer.innerHTML=""
sdkContainer.style.display="none"
result.style.display="block"
backBtn.style.display="none"

}

function goHome(){

resetSDK()

result.textContent="// Ready. Select a workflow to begin."

}

function handleOutput(data){

sdkContainer.style.display="none"
result.style.display="block"
result.textContent=JSON.stringify(data,null,2)

}

function getConfig(isFull){

const isMY=selectedCountry==="MY"

return{

countryCode:isMY?"MYS":"IDN",

workflowConfigs:{
identityVerification:{

userConsent:{
obtained:true,
obtainedAt:Date.now()
},

docVerification:{
skipDocSelectionScreen:false,
skipIntroductionScreen:false
},

...(isFull?{faceMatch:{}}:{skipFaceMatch:true}),

...(isMY?{documentType:["MyKad","MyPR","MyTentera","PASSPORT"]}:{})
}
}

}

}

async function start(isFull){

resetSDK()

result.style.display="none"
sdkContainer.style.display="block"
backBtn.style.display="inline-block"

try{

const t=await fetchToken()

const sdkParams={

token:t.access_token,
signingKey:t.signing_key||t.signingKey,
workflow:"identity-verification",
elementId:"sdk-container",
locale:"EN",

...getConfig(isFull),

onComplete:handleOutput,
onError:handleOutput

}

console.log("SDK INIT:",sdkParams)

VidaSDK.init(sdkParams)

}

catch(e){

goHome()
result.textContent="// Error: "+e.message

}

}

function startDocumentOnly(){start(false)}

function startFullVerification(){start(true)}

async function startLivenessOnly(){

resetSDK()

result.style.display="none"
sdkContainer.style.display="block"
backBtn.style.display="inline-block"

try{

const t=await fetchToken()

VidaSDK.init({

token:t.access_token,
signingKey:t.signing_key||t.signingKey,
workflow:"liveness",
elementId:"sdk-container",
locale:"EN",

onComplete:handleOutput,
onError:handleOutput

})

}

catch(e){

goHome()
result.textContent="// Error: "+e.message

}

}

</script>

</body>
</html>
