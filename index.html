<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VIDA eKYC | Enterprise Demo Portal</title>
  <script src="https://web-sdk.vida.id/1.1.0/sandbox/vida-web-sdk.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: system-ui;
      background: #F4F7F9;
    }
    .container {
      max-width: 1000px;
      margin: 40px auto;
    }
    button {
      margin: 5px;
      padding: 10px 16px;
      cursor: pointer;
    }
    #sdk-container {
      height: 500px;
      display: none;
      background: black;
      margin-bottom: 10px;
    }
    pre {
      background: #011627;
      color: #94A3B8;
      padding: 16px;
      border-radius: 8px;
      min-height: 150px;
    }
  </style>
</head>

<body>
<div class="container">

  <h3>VIDA SDK Test</h3>

  <button onclick="startDocumentOnly()">Document Only</button>
  <button onclick="startFullVerification()">Full Verification</button>
  <button onclick="startLivenessOnly()">Liveness</button>

  <div id="sdk-container"></div>
  <pre id="result">// Ready</pre>

</div>

<script>
  const result = document.getElementById("result");
  const sdkContainer = document.getElementById("sdk-container");

  async function fetchToken() {
    const res = await fetch("/.netlify/functions/get-token");
    return await res.json();
  }

  // :white_check_mark: SUCCESS HANDLER
  function handleComplete(data) {
    sdkContainer.style.display = "none";
    result.style.display = "block";

    result.textContent =
`:white_check_mark: SUCCESS (onComplete)
--------------------------------
${JSON.stringify(data, null, 2)}`;
  }

  // :x: ERROR HANDLER
  function handleError(error) {
    sdkContainer.style.display = "none";
    result.style.display = "block";

    result.textContent =
`:x: ERROR (onError)
--------------------------------
${JSON.stringify(error, null, 2)}`;
  }

  function getConfig(isFull) {
    return {
      countryCode: "IDN",
      workflowConfigs: {
        identityVerification: {
          userConsent: {
            obtained: true,
            obtainedAt: Date.now()
          },
          ...(isFull ? { faceMatch: {} } : { skipFaceMatch: true })
        }
      }
    };
  }

  async function start(isFull) {
    result.textContent = "// Fetching token...";
    try {
      const t = await fetchToken();

      VidaSDK.init({
        token: t.access_token,
        signingKey: t.signing_key || t.signingKey,
        workflow: "identity-verification",
        locale: "EN",
        ...getConfig(isFull),

        // :white_check_mark: SEPARATED HANDLERS
        onComplete: handleComplete,
        onError: handleError
      });

    } catch (e) {
      handleError(e);
    }
  }

  function startDocumentOnly() {
    start(false);
  }

  function startFullVerification() {
    start(true);
  }

  async function startLivenessOnly() {
    result.style.display = "none";
    sdkContainer.style.display = "block";

    try {
      const t = await fetchToken();

      VidaSDK.init({
        token: t.access_token,
        signingKey: t.signing_key || t.signingKey,
        workflow: "liveness",
        elementId: "sdk-container",
        locale: "EN",

        // :white_check_mark: SEPARATED HANDLERS
        onComplete: handleComplete,
        onError: handleError
      });

    } catch (e) {
      handleError(e);
    }
  }
</script>
</body>
</html>
